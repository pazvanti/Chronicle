[package]
name = "chronicle"
version = "1.0.0"
description = "Chronicle - Authoring Suite"
authors = ["Chronicle Team"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/pazvanti/Chronicle"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "chronicle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Chronicle"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
